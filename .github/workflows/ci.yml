# CI - main 머지 게이트. 세 잡(typecheck·contracts·no-emdash)이 브랜치 보호의 필수 체크다.
# 잡 이름을 바꾸면 브랜치 보호의 required checks 목록도 같이 바꿔야 한다.
#
# 트리거 정책(2026-08-26, go-ethereum go.yml 정렬): main 대상 PR과 main push마다 돈다.
# "WIP 푸시마다 러너 낭비" 문제는 승인 게이트가 아니라 concurrency로 뒤늦은 실행을 취소해서 푼다
# (go-ethereum과 동일한 접근). 외부 포크 PR의 승인-후-실행이 필요하면 그건 워크플로가 아니라
# 저장소 Actions 정책(Settings > Actions > Fork pull request workflows)에서 켠다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 같은 PR에 새 커밋이 푸시되면 이전 실행을 취소한다(러너 절약). main push는 취소하지 않는다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # TS 워크스페이스 - 타입체크 전부 + shared 지표 산식 테스트
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json packageManager 필드를 읽는다
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # shared 테스트가 node --test로 .ts를 직접 돌린다 (타입 스트리핑)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # contracts의 typecheck는 forge build라 Foundry 잡에서 따로 돈다
      - run: pnpm --filter '!@giwa-terminal/contracts' -r typecheck
      - run: pnpm --filter @giwa/shared test

  # 엠대시(U+2014) 금지 - 주석·docs·카피 포함 레포 전체 (팀 규칙 2026-08-26).
  # 빈 값 자리표시도 업비트와 같은 하이픈(-)을 쓴다.
  no-emdash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 엠대시 검출
        run: |
          if git grep -In $'\u2014' -- .; then
            echo '엠대시(U+2014) 발견: 하이픈(-)으로 바꿔야 한다'
            exit 1
          fi
          echo clean

  # Foundry - 컨트랙트 빌드 + 테스트 (재배포 금지 기간에도 소스 회귀는 잡는다)
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # forge-std가 서브모듈이다
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vv
