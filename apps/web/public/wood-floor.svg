<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480">
  <!--
    나루 원목 마루 바닥 타일 (심리스 720x480) — 톤 업 버전.
    4단 널(120px) + 엇갈린 이음매 + 널별 톤 변화 + feTurbulence 결.
    중간톤 원목 — 패널은 반투명 스크림이라 이 결이 전체 화면 아래로 흐른다.
  -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.11" numOctaves="4" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.68  0 0 0 0 0.42  0 0 0 0.08 0"/>
    </filter>
  </defs>

  <!-- 널 4단 기본 톤 -->
  <rect y="0" width="720" height="120" fill="#2c1e11"/>
  <rect y="120" width="720" height="120" fill="#271a0e"/>
  <rect y="240" width="720" height="120" fill="#2f2113"/>
  <rect y="360" width="720" height="120" fill="#291c10"/>

  <!-- 이음매 사이 널 조각별 미세 톤 변화 -->
  <rect x="250" y="0" width="310" height="120" fill="#2a1c10"/>
  <rect x="560" y="0" width="160" height="120" fill="#2c1e11"/>
  <rect x="0" y="120" width="140" height="120" fill="#251810"/>
  <rect x="470" y="120" width="250" height="120" fill="#251810"/>
  <rect x="330" y="240" width="320" height="120" fill="#2d1f12"/>
  <rect x="650" y="240" width="70" height="120" fill="#2f2113"/>
  <rect x="0" y="360" width="80" height="120" fill="#271a0e"/>
  <rect x="390" y="360" width="330" height="120" fill="#271a0e"/>

  <!-- 나뭇결 -->
  <rect width="720" height="480" filter="url(#grain)"/>

  <!-- 가로 홈(널 경계) — 어두운 골 + 아래 하이라이트 베벨 -->
  <rect y="0" width="720" height="1" fill="#0e0905" opacity="0.9"/>
  <rect y="1" width="720" height="1" fill="#6a4c2a" opacity="0.18"/>
  <rect y="119" width="720" height="2" fill="#0e0905" opacity="0.9"/>
  <rect y="121" width="720" height="1" fill="#6a4c2a" opacity="0.22"/>
  <rect y="239" width="720" height="2" fill="#0e0905" opacity="0.9"/>
  <rect y="241" width="720" height="1" fill="#6a4c2a" opacity="0.22"/>
  <rect y="359" width="720" height="2" fill="#0e0905" opacity="0.9"/>
  <rect y="361" width="720" height="1" fill="#6a4c2a" opacity="0.22"/>
  <rect y="479" width="720" height="1" fill="#0e0905" opacity="0.9"/>

  <!-- 세로 이음매(엇갈림) -->
  <rect x="249" y="1" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="251" y="1" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>
  <rect x="559" y="1" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="561" y="1" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>

  <rect x="139" y="121" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="141" y="121" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>
  <rect x="469" y="121" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="471" y="121" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>

  <rect x="329" y="241" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="331" y="241" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>
  <rect x="649" y="241" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="651" y="241" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>

  <rect x="79" y="361" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="81" y="361" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>
  <rect x="389" y="361" width="2" height="118" fill="#0e0905" opacity="0.8"/>
  <rect x="391" y="361" width="1" height="118" fill="#6a4c2a" opacity="0.15"/>
</svg>
